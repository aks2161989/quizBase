<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${quiz.title}">Answer Quiz</title>
</head>
<body>
<h1 th:text="${quiz.title}"></h1>
<p th:text="${quiz.description}"></p>

<form th:action="@{/quizzes/submit}" method="post">
  <input type="hidden" name="quizId" th:value="${quiz.id}" />

  <div th:each="question : ${quiz.questions}">
    <h3 th:text="${question.text}"></h3>
    <ul>
      <li th:each="option : ${question.options}">
        <input type="radio" th:name="${'answers[' + question.id + ']'}"
               th:value="${option.id}" />
        <span th:text="${option.text}"></span>
      </li>
    </ul>
  </div>

  <button type="submit">Submit Quiz</button>
</form>
</body>
</html>
