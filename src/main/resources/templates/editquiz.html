<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Quiz</title>
</head>
<body>
<h1>Edit Quiz</h1>
<form th:action="@{/quizzes/edit/{id}(id=${quiz.id})}" method="post">
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" th:value="${quiz.title}" required><br>

    <label for="description">Description:</label>
    <textarea id="description" name="description" th:text="${quiz.description}" required></textarea><br>

    <label for="category">Category:</label>
    <select id="category" name="categoryName" required>
        <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
                th:selected="${category.id == quiz.category.id}"></option>
    </select><br>

    <div id="questions">
        <div class="question" th:each="question, qStat : ${quiz.questions}">
            <label>Question:</label>
            <input type="text" th:name="${'questions[' + qStat.index + '].text'}" th:value="${question.text}" required><br>

            <label>Options:</label>
            <ul>
                <li th:each="option, oStat : ${question.options}">
                    <input type="text" th:name="${'questions[' + qStat.index + '].options[' + oStat.index + '].text'}"
                           th:value="${option.text}" required>
                    <input type="radio" th:name="${'questions[' + qStat.index + '].correctOption'}"
                           th:value="${oStat.index}" th:checked="${option.is_correct}" required> Correct
                </li>
            </ul>
        </div>
    </div>

    <button type="button" id="add-question">Add Question</button>
    <button type="submit">Save Changes</button>
</form>
<a th:href="@{/quizzes/your-quizzes}">Cancel</a>

<script th:src="@{/js/quizform.js}"></script>
</body>
</html>
