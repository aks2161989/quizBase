<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
</head>
<body>
<h1>Login</h1>
<form action="/users/signin" method="post">
    <label for="username" >Username:</label>
    <input th:type="text" id="username" name="username" required >
    <br>
    <label for="password" >Password:</label>
    <input th:type="password" id="password" name="password" required >
    <br>
    <button type="submit">Login</button>
</form>
<p th:if="${error}" th:text="${error}"></p>
</body>
</html>
