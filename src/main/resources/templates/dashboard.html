<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
<h1>Welcome, <span th:text="${username}">User</span>!</h1>
<form th:action="@{/users/logout}" method="post" style="float: right;">
    <button type="submit">Logout</button>
</form>
<p>Choose an action:</p>
<ul>
    <li><a th:href="@{/quizzes/listallquizzes}">Answer Quiz</a></li>
    <li><a th:href="@{/quizzes/create}">Create Quiz</a></li>
    <li><a th:href="@{/categories/create}">Create Category</a></li>
    <li><a th:href="@{/quizzes/your-quizzes}">Your Quizzes</a></li>
</ul>

<div th:if="${userQuizzes != null}">
    <h2>Your Quizzes</h2>
    <ul>
        <li th:each="quiz : ${userQuizzes}">
            <span th:text="${quiz.title}"></span>
            <a th:href="@{/quizzes/edit/{id}(id=${quiz.id})}">Edit</a>
            <form th:action="@{/quizzes/delete}" method="post" style="display: inline;">
                <input type="hidden" name="quizId" th:value="${quiz.id}" />
                <button type="submit">Delete</button>
            </form>
        </li>
    </ul>
</div>
</body>
</html>
