<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz Result</title>
</head>
<body>
<h1>Quiz Result</h1>
<p>Your score: <span th:text="${score}"></span> / <span th:text="${total}"></span></p>
<p th:text="${score} + ' correct, ' + (${total} - ${score} - ${unanswered}) + ' incorrect, ' + ${unanswered} + ' unanswered'"></p>
<a href="/dashboard">Back to Dashboard</a>
</body>
</html>
