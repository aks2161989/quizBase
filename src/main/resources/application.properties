spring.application.name=quizBase

# Server Configuration
server.port=8080
server.servlet.context-path=/

# DataSource Configuration with environment variable overrides
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quizbase?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:import.sql
spring.sql.init.data-locations=classpath:import.sql

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.show-sql=false

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# JWT Configuration
quizbase.jwt.expiration-ms=36000000
quizbase.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
